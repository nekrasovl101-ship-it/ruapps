<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RuApps">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="ruapps_icon.png">
<link rel="icon" href="ruapps_icon.png">
<title>RuApps</title>
<script>
  (function(){ var t="system"; try{ t=localStorage.getItem("ruapps-theme")||"system"; }catch(e){}
    document.documentElement.dataset.theme=t; })();
</script>
<style>
  :root{
    --bg:#ffffff; --bg2:#f2f2f7; --card:#ffffff; --text:#000; --dim:#8e8e93; --dim2:#6c6c70;
    --sep:rgba(60,60,67,.18); --pill:#eff0f4; --blue:#007aff; --red:#ff3b30;
    --glass:rgba(250,250,252,.72); --glassBorder:rgba(255,255,255,.7); --shadow:rgba(0,0,0,.12);
    --r-card:22px; --r-group:14px;
  }
  :root[data-theme="dark"]{
    --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#fff; --dim:#8e8e93; --dim2:#aeaeb2;
    --sep:rgba(84,84,88,.6); --pill:#2c2c2e; --blue:#0a84ff; --red:#ff453a;
    --glass:rgba(30,30,32,.72); --glassBorder:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="system"]{
      --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#fff; --dim:#8e8e93; --dim2:#aeaeb2;
      --sep:rgba(84,84,88,.6); --pill:#2c2c2e; --blue:#0a84ff; --red:#ff453a;
      --glass:rgba(30,30,32,.72); --glassBorder:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--text);
    font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  button{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}

  /* ---------- большой заголовок ---------- */
  .lt{padding:calc(env(safe-area-inset-top) + 18px) 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .lt small{display:block;color:var(--dim);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
  .lt h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .avatar{width:36px;height:36px;border-radius:50%;border:0;padding:0;cursor:pointer;overflow:hidden;flex:none;
    background:var(--pill);box-shadow:0 0 0 .5px var(--sep)}
  .avatar img{width:100%;height:100%;object-fit:cover}

  /* ---------- карточки «Сегодня» ---------- */
  .today{display:grid;gap:22px;margin-top:14px}
  .tc{position:relative;border-radius:var(--r-card);overflow:hidden;color:#fff;cursor:pointer;min-height:420px;
    box-shadow:0 10px 30px var(--shadow);transition:transform .2s cubic-bezier(.2,.9,.3,1)}
  .tc:active{transform:scale(.97)}
  .tc .tx{position:absolute;left:20px;right:20px;top:20px;z-index:2}
  .tc small{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;opacity:.8}
  .tc h2{margin:4px 0 0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em;max-width:85%}
  .tc .art{position:absolute;right:-20px;bottom:40px;font-size:190px;transform:rotate(-12deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
  .tc .ft{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;display:flex;align-items:center;gap:12px;
    background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:2}
  .tc .ft p{margin:0;font-size:14px;opacity:.95;flex:1}
  .tc .ft img{width:40px;height:40px;border-radius:22.37%}
  .hero-app{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:60px}
  .hero-app img{width:150px;height:150px;border-radius:22.37%;box-shadow:0 20px 40px rgba(0,0,0,.3)}

  /* ---------- секции ---------- */
  .sec{margin-top:30px;border-top:.5px solid var(--sep);padding-top:16px}
  .sec:first-of-type{border-top:0}
  .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .sh h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .sh a{color:var(--blue);font-size:17px;cursor:pointer;white-space:nowrap}
  .sh p{margin:2px 0 0;color:var(--dim);font-size:15px}

  /* горизонтальная подборка по 3 строки */
  .rail{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:calc(100% - 28px);
    gap:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -20px 0;padding:0 20px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail .ar{scroll-snap-align:start}
  .rail.one{grid-template-rows:auto}

  /* строка приложения */
  .ar{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;min-width:0}
  .ar .ic{width:64px;height:64px;border-radius:22.37%;flex:none;object-fit:cover;background:var(--pill);
    box-shadow:0 0 0 .5px var(--sep)}
  .ar .mt{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;
    border-bottom:.5px solid var(--sep);padding:6px 0;margin:-8px 0}
  .ar:last-child .mt,.rail .ar:nth-child(3n) .mt{border-bottom-color:transparent}
  .ar .nm{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ar .sb{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ar .sb.w{color:var(--red)}
  .ar .rk{width:18px;flex:none;font-weight:600;font-size:17px;text-align:center;margin-left:-4px}
  .getwrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
  .get{border:0;border-radius:999px;background:var(--pill);color:var(--blue);font-weight:700;font-size:15px;
    padding:6px 0;width:84px;text-align:center;cursor:pointer;display:inline-block}
  .get:active{opacity:.55}
  .getwrap small{font-size:9.5px;color:var(--dim);line-height:1}
  .list{margin-top:6px}

  /* ---------- поиск ---------- */
  .sf{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--pill);border-radius:12px;padding:0 10px;height:38px}
  .sf svg{width:17px;height:17px;flex:none;color:var(--dim)}
  .sf input{flex:1;border:0;background:none;outline:none;font:17px inherit;font-family:inherit;color:var(--text);min-width:0}
  .sf input::placeholder{color:var(--dim)}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .cat{border-radius:16px;height:96px;padding:12px;color:#fff;font-weight:700;font-size:17px;position:relative;overflow:hidden;cursor:pointer}
  .cat span{position:absolute;right:-6px;bottom:-12px;font-size:64px;transform:rotate(-12deg)}
  .cat:active{transform:scale(.97)}

  /* ---------- пусто ---------- */
  .empty{text-align:center;color:var(--dim);padding:40px 20px}
  .empty .e{font-size:56px;margin-bottom:10px}
  .empty b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}

  /* ---------- страницы ---------- */
  .page{display:none}.page.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .back{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;border:0;background:none;padding:0;cursor:pointer;
    margin-top:calc(env(safe-area-inset-top) + 14px)}
  .back svg{width:22px;height:22px}

  /* ---------- стеклянный таб-бар ---------- */
  .tabbar{position:fixed;left:50%;bottom:max(8px, calc(env(safe-area-inset-bottom) - 14px));transform:translateX(-50%);z-index:20;
    display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    border:.5px solid var(--glassBorder);box-shadow:0 10px 40px var(--shadow),0 1px 0 rgba(255,255,255,.4) inset;
    width:min(calc(100% - 24px),460px)}
  .tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;
    border-radius:999px;color:var(--text);font-size:10.5px;font-weight:600;cursor:pointer;position:relative;transition:background .2s,color .2s}
  .tab svg{width:25px;height:25px}
  .tab.on{color:var(--blue);background:rgba(127,127,140,.14)}
  .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;
    font-size:11px;line-height:17px;padding:0 4px;font-weight:600}

  /* ---------- шит ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 14px);max-width:820px;margin:0 auto;
    background:var(--bg);border-radius:14px 14px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding:0 20px calc(env(safe-area-inset-bottom) + 30px)}
  .sheet.on{transform:none}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .grab{position:sticky;top:0;padding:8px 0 4px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);z-index:2}
  .grab i{width:36px;height:5px;border-radius:3px;background:var(--sep);position:absolute;left:50%;top:6px;margin-left:-18px}
  .close{margin-left:auto;margin-top:6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--pill);color:var(--dim2);
    font-size:17px;font-weight:700;cursor:pointer;display:grid;place-items:center}

  /* страница приложения */
  .ah{display:flex;gap:16px;margin-top:6px}
  .ah .ic{width:118px;height:118px;border-radius:22.37%;flex:none;box-shadow:0 0 0 .5px var(--sep)}
  .ah .mt{flex:1;min-width:0;display:flex;flex-direction:column}
  .ah h2{margin:2px 0 0;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  .ah .sub{color:var(--dim);font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ah .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .get.blue{background:var(--blue);color:#fff;width:92px}
  .share{border:0;background:none;color:var(--blue);cursor:pointer;padding:4px}
  .share svg{width:24px;height:24px}
  .info{display:flex;margin:22px -20px 0;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--sep)}
  .info::-webkit-scrollbar{display:none}
  .info div{flex:none;min-width:104px;text-align:center;padding:0 12px;border-left:.5px solid var(--sep)}
  .info div:first-child{border-left:0;padding-left:0}
  .info small{display:block;color:var(--dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .info b{display:block;font-size:20px;color:var(--dim2);margin:4px 0 2px;font-weight:700}
  .info span{display:block;color:var(--dim);font-size:12px}
  .blk{padding:16px 0;border-bottom:.5px solid var(--sep)}
  .blk h3{margin:0 0 8px;font-size:22px;font-weight:700}
  .blk p{margin:0;font-size:15px;line-height:1.45;color:var(--text)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:.5px solid var(--sep);font-size:15px}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;word-break:break-all}
  .wbox{margin-top:16px;padding:14px 16px;border-radius:var(--r-group);background:rgba(255,59,48,.12);color:var(--red);font-size:15px;line-height:1.4}

  /* сгруппированные списки (настройки) */
  .gl{background:var(--bg2);border-radius:var(--r-group);overflow:hidden;margin-top:8px}
  .gh{color:var(--dim);font-size:13px;text-transform:uppercase;margin:26px 16px 0;letter-spacing:.02em}
  .gf{color:var(--dim);font-size:13px;margin:8px 16px 0;line-height:1.4}
  .gf b{color:var(--text);font-weight:600}
  .gr{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px}
  .gr .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:17px;color:#fff;flex:none}
  .gr .t{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-bottom:.5px solid var(--sep);padding:8px 0}
  .gr:last-child .t{border-bottom:0}
  .gr .t small{color:var(--dim);font-size:13px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(118,118,128,.16);border-radius:9px;padding:2px;margin:12px 16px}
  .seg button{border:0;background:none;font-size:14px;font-weight:600;padding:7px 0;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}


  /* ---------- настройки в стиле iOS ---------- */
  .avatar{display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
  .avatar.anon{background:linear-gradient(180deg,#b5b5bb,#8e8e93)}
  .avatar svg{width:22px;height:22px}
  .st{padding:6px 0 10px}
  .st h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
  .acct{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
  .av{border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:600;
    background:linear-gradient(180deg,#b5b5bb,#8e8e93)}
  .av img{width:100%;height:100%;object-fit:cover}
  .av svg{width:56%;height:56%}
  .acct .t{flex:1;min-width:0}
  .acct .t b{display:block;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .t small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
  .gr.btn{cursor:pointer}
  .gr.btn:active{background:rgba(127,127,140,.12)}
  .gr .t{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
  .gr .t .lbl{display:flex;flex-direction:column;min-width:0}
  .gr .val{color:var(--dim);font-size:17px;white-space:nowrap}
  .chev{width:8px;height:14px;flex:none;color:#c4c4c7;margin-left:6px}
  .gr.center .t{justify-content:center}
  .gr.danger .t{color:var(--red);justify-content:center;font-weight:400}
  .check{color:var(--blue);font-weight:700}
  .bk{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;border:0;background:none;padding:6px 0;cursor:pointer}
  .bk svg{width:22px;height:22px}
  .bigav{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
  .bigav b{font-size:24px;font-weight:700;margin-top:10px}
  .bigav small{color:var(--dim);font-size:15px;margin-top:2px}
  .login{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 8px 0}
  .login img.logo{width:96px;height:96px;border-radius:22.37%;box-shadow:0 10px 30px var(--shadow)}
  .login h2{margin:18px 0 6px;font-size:28px;font-weight:700}
  .login p{margin:0;color:var(--dim);font-size:15px;line-height:1.4;max-width:320px}
  .lbtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:28px;align-items:stretch}
  .abtn{height:44px;border-radius:999px;border:0;background:#000;color:#fff;font-size:17px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  :root[data-theme="dark"] .abtn{background:#fff;color:#000}
  @media (prefers-color-scheme: dark){ :root[data-theme="system"] .abtn{background:#fff;color:#000} }
  .abtn svg{width:18px;height:18px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .fine{color:var(--dim);font-size:12px;line-height:1.4;margin-top:22px;max-width:320px}
  .need{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,149,0,.14);color:#c26a00;font-size:14px;line-height:1.4;text-align:left}

  /* алерт и тост */
  .cf-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:24px}
  .cf-bg.on{display:flex}
  .cf{width:270px;border-radius:14px;overflow:hidden;text-align:center;background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
  .cf .in{padding:20px 16px 18px}
  .cf .t{font-weight:600;font-size:17px}
  .cf .d{font-size:13px;margin-top:4px;line-height:1.35}
  .cf .b{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
  .cf .b>*{padding:11px 0;font-size:17px;border:0;background:none;color:var(--blue);cursor:pointer}
  .cf .b>*+*{border-left:.5px solid var(--sep)}
  .cf .b .yes{color:var(--red);font-weight:600}
  .toast{position:fixed;left:50%;bottom:calc(max(8px, calc(env(safe-area-inset-bottom) - 14px)) + 80px);transform:translate(-50%,16px);opacity:0;z-index:60;
    background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px var(--shadow)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- оценки и отзывы ---------- */
  .stars{color:#ff9500;letter-spacing:1px;white-space:nowrap}
  .stars i{font-style:normal;color:rgba(127,127,140,.35)}
  .rsum{display:flex;align-items:center;gap:18px;margin:4px 0 12px}
  .rsum .big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .rsum .big small{display:block;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:0;margin-top:4px;text-align:center}
  .bars{flex:1;display:flex;flex-direction:column;gap:3px}
  .bars div{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
  .bars div span:first-child{width:52px;text-align:right;color:var(--dim);letter-spacing:-1px}
  .bars em{flex:1;height:4px;border-radius:2px;background:var(--pill);overflow:hidden;display:block}
  .bars em b{display:block;height:100%;background:var(--dim)}
  .revs{display:grid;grid-auto-flow:column;grid-auto-columns:calc(100% - 28px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
  .revs::-webkit-scrollbar{display:none}
  .rv{scroll-snap-align:start;background:var(--bg2);border-radius:var(--r-group);padding:14px 16px;min-height:150px;display:flex;flex-direction:column}
  .rv .h{display:flex;justify-content:space-between;gap:8px;font-size:15px}
  .rv .h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rv .h span{color:var(--dim);font-size:13px;white-space:nowrap}
  .rv .m{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-top:2px}
  .rv p{margin:8px 0 0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .rv .del{margin-top:auto;padding-top:8px;color:var(--red);font-size:13px;cursor:pointer;align-self:flex-start;border:0;background:none;padding-left:0}
  .linkbtn{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:17px;cursor:pointer;border:0;background:none;padding:10px 0}
  .pick{display:flex;justify-content:center;gap:10px;font-size:40px;margin:14px 0 4px;user-select:none}
  .pick span{cursor:pointer;color:rgba(127,127,140,.35);transition:transform .15s}
  .pick span.on{color:#ff9500}
  .pick span:active{transform:scale(.85)}
  .fld{width:100%;border:0;background:none;font:17px/1.4 inherit;font-family:inherit;color:var(--text);outline:none;padding:12px 16px;resize:vertical}
  .fld+.fld{border-top:.5px solid var(--sep)}
  /* совместимость */
  .compat{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:var(--r-group);font-size:15px;line-height:1.35}

  }

function plural(n, a, b, c) { const m = n % 10, k = n % 100; return m === 1 && k !== 11 ? a : m >= 2 && m <= 4 && (k < 12 || k > 14) ? b : c; }

/* =====================================================================
   Сервер RuApps и аккаунт разработчика
   ===================================================================== */
const API = (AUTH && AUTH.api_url || "").replace(/\/+$/, "");
const BOT = AUTH && AUTH.bot_username || "";
const serverOn = () => !!API;

async function api(path, opts = {}) {
  const u = userGet();
  const h = Object.assign({}, opts.headers || {});
  if (u && u.session) h.authorization = "Bearer " + u.session;
  if (opts.json) { h["content-type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(API + path, { method: opts.method || "GET", headers: h, body: opts.body });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && u && u.session) { userSet({ ...u, session: "", dev: false }); }
  if (!r.ok) throw Object.assign(new Error(j.message || "Ошибка сервера"), { status: r.status, data: j });
  return j;
}
async function serverLogin(idToken) {
  if (!serverOn() || !idToken) return;
  try {
    const r = await api("/session", { method: "POST", json: { id_token: idToken } });
    const u = userGet(); if (u) userSet({ ...u, session: r.token, dev: !!r.dev });
  } catch (e) { toast("Сервер RuApps недоступен"); }
}
async function refreshMe() {
  const u = userGet(); if (!serverOn() || !u || !u.session) return u;
  try { const r = await api("/me"); userSet({ ...userGet(), dev: !!r.dev }); } catch (e) {}
  return userGet();
}
const isDev = () => { const u = userGet(); return !!(u && u.session && u.dev); };

/* ---------- приложения разработчиков в каталоге ---------- */
async function loadRemoteApps() {
  if (!serverOn()) return;
  try {
    const list = await fetch(API + "/apps").then(r => r.json());
    if (!Array.isArray(list)) return;
    for (const a of list) {
      if (APPS.some(x => x.remoteId === a.id)) continue;
      APPS.push({ name: a.name, bundle: a.bundle, version: a.version, build: a.build, minIOS: a.minIOS, size: a.size,
                  icon: a.icon || "ruapps_icon.png", install: a.install, cat: a.cat, warn: null,
                  desc: a.desc, devName: a.dev, devId: a.devId, remoteId: a.id, team: a.team, exp: a.exp, all: a.all,
                  udh: a.udh, installs: a.installs, created: a.created, sig: a.sig || "ok", download: a.download });
    }
    renderAll();
  } catch (e) {}
  openFromHash();
}

function putBlob(path, blob, onProgress) {
  return new Promise((ok, bad) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", API + path);
    xhr.setRequestHeader("authorization", "Bearer " + userGet().session);
    xhr.setRequestHeader("content-type", "application/octet-stream");
    if (onProgress) xhr.upload.onprogress = e => onProgress(e.loaded);
    xhr.onload = () => {
      let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      xhr.status === 200 ? ok(j) : bad(Object.assign(new Error(j.message || "Ошибка " + xhr.status), { status: xhr.status }));
    };
    xhr.onerror = () => bad(new Error("Нет связи с сервером"));
    xhr.send(blob);

/* =====================================================================
   Чтение IPA в браузере: ZIP → Info.plist (XML/бинарный) → иконка (в т.ч. Apple CgBI)
   ===================================================================== */
async function readIPA(file) {
  const entries = await zipEntries(file);
  const infoE = entries.find(e => /^Payload\/[^/]+\.app\/Info\.plist$/.test(e.name));
  if (!infoE) throw new Error("внутри нет Payload/*.app/Info.plist");
  const appDir = infoE.name.slice(0, -"Info.plist".length);
  const info = parsePlist(await zipRead(file, infoE));
  const names = new Set(["AppIcon"]);
  for (const k of ["CFBundleIcons", "CFBundleIcons~ipad"]) {
    const pi = info[k] && info[k].CFBundlePrimaryIcon;
    if (pi && pi.CFBundleIconFiles) pi.CFBundleIconFiles.forEach(n => names.add(n));
    if (pi && pi.CFBundleIconName) names.add(pi.CFBundleIconName);
  }
  (info.CFBundleIconFiles || []).forEach(n => names.add(n));
  if (info.CFBundleIconFile) names.add(info.CFBundleIconFile);
  const pngs = entries.filter(e => e.name.startsWith(appDir) && !e.name.slice(appDir.length).includes("/") && /\.png$/i.test(e.name))
    .filter(e => { const b = e.name.slice(appDir.length).split("@")[0].split("~")[0].replace(/\.png$/i, "");
                   return [...names].some(n => b.startsWith(n.replace(/\.png$/i, ""))); });
  let iconBlob = null, best = 0;
  for (const e of pngs) {
    try { const bytes = await zipRead(file, e); const sz = pngSize(bytes);
      if (sz.w * sz.h > best) { const b = await pngToBlob(bytes); if (b) { iconBlob = b; best = sz.w * sz.h; } } } catch (err) {}
  }
  if (!iconBlob) iconBlob = await letterIcon((info.CFBundleDisplayName || info.CFBundleName || "?")[0]);
  let prov = null;
  const pe = entries.find(e => e.name === appDir + "embedded.mobileprovision");
  if (pe) { try { prov = parseProvision(await zipRead(file, pe)); prov.udh = await Promise.all(prov.list.slice(0, 1000).map(udidHash)); delete prov.list; } catch (err) {} }
  return { name: info.CFBundleDisplayName || info.CFBundleName || file.name.replace(/\.ipa$/i, ""),
           bundle: info.CFBundleIdentifier || "", version: String(info.CFBundleShortVersionString || info.CFBundleVersion || "1.0"),
           build: String(info.CFBundleVersion || ""), minIOS: String(info.MinimumOSVersion || ""),
           iconBlob, iconURL: URL.createObjectURL(iconBlob), prov };
}

/* ---- ZIP ---- */
async function buf(file, start, end) { return new Uint8Array(await file.slice(start, end).arrayBuffer()); }
const u16 = (b, o) => b[o] | b[o + 1] << 8;
const u32 = (b, o) => (b[o] | b[o + 1] << 8 | b[o + 2] << 16 | b[o + 3] << 24) >>> 0;
async function zipEntries(file) {
  const tailLen = Math.min(file.size, 66000);
  const tail = await buf(file, file.size - tailLen, file.size);
  let eo = -1;
  for (let i = tail.length - 22; i >= 0; i--) if (u32(tail, i) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error("это не ZIP/IPA");
  let cdSize = u32(tail, eo + 12), cdOff = u32(tail, eo + 16), count = u16(tail, eo + 10);
  if (cdOff === 0xffffffff || count === 0xffff) {       // ZIP64
    const l = eo - 20;
    if (l >= 0 && u32(tail, l) === 0x07064b50) {
      const z64 = Number(new DataView(tail.buffer, tail.byteOffset + l + 8, 8).getBigUint64(0, true));
      const h = await buf(file, z64, z64 + 56);
      count = Number(new DataView(h.buffer).getBigUint64(32, true));
      cdSize = Number(new DataView(h.buffer).getBigUint64(40, true));
      cdOff = Number(new DataView(h.buffer).getBigUint64(48, true));
    }
  }
  const cd = await buf(file, cdOff, cdOff + cdSize);
  const out = []; let p = 0;
  const dec = new TextDecoder();
  while (p + 46 <= cd.length && u32(cd, p) === 0x02014b50) {
    const nl = u16(cd, p + 28), el = u16(cd, p + 30), cl = u16(cd, p + 32);
    out.push({ name: dec.decode(cd.subarray(p + 46, p + 46 + nl)), method: u16(cd, p + 10),
               csize: u32(cd, p + 20), usize: u32(cd, p + 24), off: u32(cd, p + 42) });
    p += 46 + nl + el + cl;
  }
  return out;
}
async function zipRead(file, e) {
  const lh = await buf(file, e.off, e.off + 30);
  const start = e.off + 30 + u16(lh, 26) + u16(lh, 28);
  const raw = file.slice(start, start + e.csize);
  if (e.method === 0) return new Uint8Array(await raw.arrayBuffer());
  if (e.method === 8) return inflateRaw(raw);
  throw new Error("неизвестное сжатие " + e.method);
}
async function inflateRaw(blobOrBytes) {
  const b = blobOrBytes instanceof Blob ? blobOrBytes : new Blob([blobOrBytes]);
  return new Uint8Array(await new Response(b.stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
}

/* ---- plist ---- */
function parsePlist(bytes) {
  if (String.fromCharCode(...bytes.subarray(0, 8)) === "bplist00") return parseBPlist(bytes);
  return xmlPlist(new TextDecoder().decode(bytes));
}
function xmlPlist(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  const conv = n => {
    switch (n.tagName) {
      case "dict": { const o = {}; const k = [...n.children]; for (let i = 0; i < k.length; i += 2) o[k[i].textContent] = conv(k[i + 1]); return o; }
      case "array": return [...n.children].map(conv);
      case "string": return n.textContent;
      case "integer": return parseInt(n.textContent, 10);
      case "real": return parseFloat(n.textContent);
      case "true": return true; case "false": return false;
      case "date": return new Date(n.textContent);
      default: return n.textContent;
    }
  };
  const root = doc.querySelector("plist > *");
  return root ? conv(root) : {};
}
function parseBPlist(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const t = b.length - 32;
  const offSize = b[t + 6], refSize = b[t + 7];
  const nObj = Number(dv.getBigUint64(t + 8)), top = Number(dv.getBigUint64(t + 16)), tableOff = Number(dv.getBigUint64(t + 24));
  const readN = (o, n) => { let v = 0; for (let i = 0; i < n; i++) v = v * 256 + b[o + i]; return v; };
  const offs = []; for (let i = 0; i < nObj; i++) offs.push(readN(tableOff + i * offSize, offSize));
  const lenAt = (o, nib) => {
    if (nib !== 15) return [nib, o + 1];
    const m = b[o + 1], n = 1 << (m & 15); return [readN(o + 2, n), o + 2 + n];
  };
  const obj = i => {
    const o = offs[i], m = b[o], hi = m >> 4, lo = m & 15;
    switch (hi) {
      case 0: return lo === 8 ? false : lo === 9 ? true : null;
      case 1: { const n = 1 << lo; return n === 8 ? Number(dv.getBigInt64(o + 1)) : readN(o + 1, n); }
      case 2: return lo === 2 ? dv.getFloat32(o + 1) : dv.getFloat64(o + 1);
      case 3: return new Date((dv.getFloat64(o + 1) + 978307200) * 1000);
      case 4: { const [n, s] = lenAt(o, lo); return b.subarray(s, s + n); }
      case 5: { const [n, s] = lenAt(o, lo); return String.fromCharCode(...b.subarray(s, s + n)); }
      case 6: { const [n, s] = lenAt(o, lo); let r = ""; for (let k = 0; k < n; k++) r += String.fromCharCode(dv.getUint16(s + k * 2)); return r; }
      case 8: return readN(o + 1, lo + 1);
      case 10: { const [n, s] = lenAt(o, lo); const a = []; for (let k = 0; k < n; k++) a.push(obj(readN(s + k * refSize, refSize))); return a; }
      case 13: { const [n, s] = lenAt(o, lo); const r = {};
        for (let k = 0; k < n; k++) r[obj(readN(s + k * refSize, refSize))] = obj(readN(s + (n + k) * refSize, refSize)); return r; }
      default: return null;
    }
  };
  return obj(top);
}
function parseProvision(bytes) {
  const s = new TextDecoder("latin1").decode(bytes);
  const a = s.indexOf("<?xml"), z = s.indexOf("</plist>");
  if (a < 0 || z < 0) return null;
  const p = xmlPlist(new TextDecoder().decode(bytes.subarray(a, z + 8)));
  return { team: p.TeamName || "", exp: p.ExpirationDate ? +new Date(p.ExpirationDate) : 0,
           devices: (p.ProvisionedDevices || []).length, all: !!p.ProvisionsAllDevices, list: p.ProvisionedDevices || [] };
}

/* ---- PNG и «сплющенные» иконки Apple (CgBI) ---- */
function pngSize(b) { return { w: u32be(b, 16 + (isCgBI(b) ? 16 : 0)), h: u32be(b, 20 + (isCgBI(b) ? 16 : 0)) }; }
const u32be = (b, o) => (b[o] << 24 | b[o + 1] << 16 | b[o + 2] << 8 | b[o + 3]) >>> 0;
const isCgBI = b => String.fromCharCode(b[12], b[13], b[14], b[15]) === "CgBI";
async function pngToBlob(b) {
  if (b[0] !== 0x89 || b[1] !== 0x50) return null;
  if (!isCgBI(b)) return new Blob([b], { type: "image/png" });
  let p = 8, w = 0, h = 0, ctype = 6; const idat = [];
  while (p < b.length) {
    const len = u32be(b, p), type = String.fromCharCode(b[p + 4], b[p + 5], b[p + 6], b[p + 7]), d = b.subarray(p + 8, p + 8 + len);
    if (type === "IHDR") { w = u32be(d, 0); h = u32be(d, 4); ctype = d[9]; if (d[8] !== 8) return null; }
    else if (type === "IDAT") idat.push(d);
    else if (type === "IEND") break;
    p += 12 + len;
  }
  const bpp = ctype === 6 ? 4 : ctype === 2 ? 3 : 0; if (!bpp) return null;
  const raw = await inflateRaw(new Blob(idat));
  const stride = w * bpp, px = new Uint8ClampedArray(w * h * 4);
  let prev = new Uint8Array(stride), q = 0;
  for (let y = 0; y < h; y++) {
    const f = raw[q++], line = raw.slice(q, q + stride); q += stride;
    for (let i = 0; i < stride; i++) {
      const a = i >= bpp ? line[i - bpp] : 0, up = prev[i], c = i >= bpp ? prev[i - bpp] : 0;
      let v = line[i];
      if (f === 1) v += a; else if (f === 2) v += up; else if (f === 3) v += (a + up) >> 1;
      else if (f === 4) { const pa = Math.abs(up - c), pb = Math.abs(a - c), pc = Math.abs(a + up - 2 * c); v += pa <= pb && pa <= pc ? a : pb <= pc ? up : c; }
      line[i] = v & 255;
    }
    for (let x = 0; x < w; x++) {
      const s = x * bpp, o = (y * w + x) * 4, al = bpp === 4 ? line[s + 3] : 255;
      let B = line[s], G = line[s + 1], R = line[s + 2];
      if (al && al < 255) { R = Math.min(255, R * 255 / al); G = Math.min(255, G * 255 / al); B = Math.min(255, B * 255 / al); }
      px[o] = R; px[o + 1] = G; px[o + 2] = B; px[o + 3] = al;
    }
    prev = line;
  }
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  cv.getContext("2d").putImageData(new ImageData(px, w, h), 0, 0);
  return new Promise(r => cv.toBlob(r, "image/png"));
}
function letterIcon(ch) {
  const cv = document.createElement("canvas"); cv.width = cv.height = 256; const g = cv.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 256, 256); gr.addColorStop(0, "#3d8bff"); gr.addColorStop(1, "#1650e6");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  g.fillStyle = "#fff"; g.font = "bold 140px -apple-system, Helvetica, Arial"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText((ch || "?").toUpperCase(), 128, 136);
  return new Promise(r => cv.toBlob(r, "image/png"));
}

async function udidHash(u) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(u).trim().toLowerCase()));
  return [...new Uint8Array(d)].slice(0, 8).map(b => b.toString(16).padStart(2, "0")).join("");
}

  "iPhone18,3":"iPhone 17","iPhone18,1":"iPhone 17 Pro","iPhone18,2":"iPhone 17 Pro Max","iPhone18,4":"iPhone Air",
  "iPhone14,7":"iPhone 14","iPhone14,8":"iPhone 14 Plus","iPhone15,2":"iPhone 14 Pro","iPhone15,3":"iPhone 14 Pro Max",
  "iPhone14,5":"iPhone 13","iPhone14,4":"iPhone 13 mini","iPhone14,2":"iPhone 13 Pro","iPhone14,3":"iPhone 13 Pro Max","iPhone14,6":"iPhone SE (3)",
  "iPhone13,2":"iPhone 12","iPhone13,1":"iPhone 12 mini","iPhone13,3":"iPhone 12 Pro","iPhone13,4":"iPhone 12 Pro Max","iPhone12,1":"iPhone 11"};
const modelName = m => MODELS[m] || m || "iPhone";
function compatOf(a) {

  if (!Array.isArray(a.udh)) return null;          // нет данных о подписи

}

async function takeUdidFromHash() {

  store.set("ruapps-device", { h: await udidHash(decodeURIComponent(m[1])), model: q.get("model") || "", ios: q.get("ios") || "", at: Date.now() });
  renderAll();

  setTimeout(openUdid, 400);
}

function squareJPEG(file, size) {
  return new Promise((ok, bad) => {
    const img = new Image(); img.onerror = bad;
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = cv.height = size;
      const s = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      let q = .85, url = cv.toDataURL("image/jpeg", q);
      while (url.length > 85000 && q > .3) { q -= .1; url = cv.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(img.src); ok(url);
    };
    img.src = URL.createObjectURL(file);
  });
}

const PLURALS = [[/(\d+) (приложение|приложения|приложений)/g, (m, n) => `${n} app${n == 1 ? "" : "s"}`],
  [/(\d+) (оценка|оценки|оценок)/g, (m, n) => `${n} rating${n == 1 ? "" : "s"}`],
  [/(\d+) (профиль|профиля|профилей)/g, (m, n) => `${n} profile${n == 1 ? "" : "s"}`],
  [/(\d+) (раз|раза)(?![а-я])/g, (m, n) => `${n} time${n == 1 ? "" : "s"}`]];
const CYR = /[А-Яа-яЁё]/;
function tr(str) {
  if (LANG !== "en" || !str) return str;
  const t = String(str).trim(); if (!t || !CYR.test(t)) return str;
  let r = EN[t];
  if (r === undefined) for (const [rx, f] of EN_RX) if (rx.test(t)) { r = typeof f === "string" ? t.replace(rx, f) : null; break; }
  if (r == null) {
    r = t; for (const [rx, f] of PLURALS) r = r.replace(rx, f);
    if (EN[r] !== undefined) r = EN[r];
    else for (const [a, b] of FRAG) r = r.split(a).join(b);
    r = r.replace(/^(.*?) · (.+)$/, (m, a, b) => (EN[a] || a) + " · " + (EN[b] || b));
  }
  return String(str).replace(t, r);
}
function i18n(root) {
  if (LANG !== "en" || !root) return;
  if (root.nodeType === 3) { if (!root.parentElement || !root.parentElement.closest("[data-noi18n],script,style,textarea")) { const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest("[data-noi18n],script,style")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { if (!n.parentElement.closest("[data-noi18n],script,style,textarea")) { const v = tr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; } });
  [root, ...root.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(el => {
    for (const at of ["placeholder", "aria-label", "title"]) if (el.hasAttribute && el.hasAttribute(at)) { const v = tr(el.getAttribute(at)); if (v !== el.getAttribute(at)) el.setAttribute(at, v); }
  });
}
if (LANG === "en") {
  document.documentElement.lang = "en";
  const _confirm = window.confirm.bind(window); window.confirm = m => _confirm(tr(m));
  new MutationObserver(ms => ms.forEach(m => { if (m.type === "characterData") i18n(m.target); else m.addedNodes.forEach(i18n); }))
    .observe(document.body, { childList: true, subtree: true, characterData: true });
  i18n(document.body);
}

/* ---- ссылки вида #app=... ---- */
function openFromHash() {
  const m = location.hash.match(/^#app=(.+)$/); if (!m) return;
  const key = decodeURIComponent(m[1]);
  const a = APPS.find(x => appKey(x) === key);
  if (a && !$("#sheet").classList.contains("on")) openApp(a);
}

/* ---------- Android ---------- */
const UA = navigator.userAgent;
const isAndroid = /Android/i.test(UA);
// iPad в Safari притворяется Mac, но у него сенсорный экран
const isMac = /Macintosh|Mac OS X/i.test(UA) && !/iPhone|iPad|iPod/i.test(UA) && !(navigator.maxTouchPoints > 0);
const blocked = isAndroid || isMac;
function androidAlert() {
  if (isMac) {
    $("#andrE").textContent = "💻"; $("#andrT").textContent = "Вы на macOS";
    $("#andrD").textContent = "На компьютере невозможно устанавливать приложения. Открой RuApps в Safari на iPhone или iPad.";
  }
  $("#andr").classList.add("on");
}
$("#andrOk").addEventListener("click", () => $("#andr").classList.remove("on"));
$("#andr").addEventListener("click", e => { if (e.target.id === "andr") $("#andr").classList.remove("on"); });
// профили (.mobileconfig) тоже только для iOS
document.addEventListener("click", e => {
  const l = e.target.closest('a[href$=".mobileconfig"]');
  if (l && blocked) { e.preventDefault(); e.stopPropagation(); androidAlert(); }
}, true);

/* ---------- установка ---------- */
function install(a) {
  if (blocked) { androidAlert(); return; }
  if (authOn() && !userGet()) { openLogin(a); return; }
  if (compatOf(a) === false && !confirm(`Твоего ${modelName(myDev().model)} нет в подписи «${a.name}» — скорее всего, не установится. Всё равно попробовать?`)) return;
  if (a.warn) { $("#cfYes").href = a.install; $("#cfYes").dataset.i = APPS.indexOf(a); $("#cf").classList.add("on"); return; }
  addMine(a); location.href = a.install;
}
$("#cfNo").addEventListener("click", () => $("#cf").classList.remove("on"));
$("#cfYes").addEventListener("click", () => { addMine(APPS[+$("#cfYes").dataset.i]); setTimeout(() => $("#cf").classList.remove("on"), 300); });
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

/* ---------- навигация ---------- */
let curPage = "today";
function showPage(p) {
  curPage = p;
  $$(".page").forEach(x => x.classList.toggle("on", x.id === "p-" + p));
  if (p !== "cat") $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === p));
  window.scrollTo(0, 0);
}
$$(".tab").forEach(t => t.addEventListener("click", () => {
  if (t.dataset.p === curPage) { window.scrollTo({top:0, behavior:"smooth"}); return; }
  showPage(t.dataset.p); if (t.dataset.p === "search") setTimeout(() => $("#q").focus(), 50);
}));

document.addEventListener("click", e => {
  const ins = e.target.closest("[data-install]");
  if (ins) { e.stopPropagation(); install(APPS[+ins.dataset.install]); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm) { mySet(myGet().filter(b => b !== APPS[+rm.dataset.remove].bundle)); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const a = APPS[+sh.dataset.share], url = location.href.split("#")[0] + "#app=" + encodeURIComponent(appKey(a));
    if (navigator.share) navigator.share({title:a.name, text:`${a.name} в RuApps`, url}).catch(() => {});
    else { navigator.clipboard && navigator.clipboard.writeText(url); toast("Ссылка скопирована"); } return; }
  if (e.target.closest("[data-open='settings']")) { openSettings(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat && !e.target.closest(".ar")) { openCat(cat.dataset.cat); return; }
  const row = e.target.closest("[data-i]");
  if (row) openApp(APPS[+row.dataset.i]);
});
