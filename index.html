<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RuApps">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="ruapps_icon.png">
<link rel="icon" href="ruapps_icon.png">
<title>RuApps</title>
<script>
  (function(){ var t="system"; try{ t=localStorage.getItem("ruapps-theme")||"system"; }catch(e){}
    document.documentElement.dataset.theme=t; })();
</script>
<style>
  :root{
    --bg:#ffffff; --bg2:#f2f2f7; --card:#ffffff; --text:#000; --dim:#8e8e93; --dim2:#6c6c70;
    --sep:rgba(60,60,67,.18); --pill:#eff0f4; --blue:#007aff; --red:#ff3b30;
    --glass:rgba(250,250,252,.72); --glassBorder:rgba(255,255,255,.7); --shadow:rgba(0,0,0,.12);
    --r-card:22px; --r-group:14px;
  }
  :root[data-theme="dark"]{
    --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#fff; --dim:#8e8e93; --dim2:#aeaeb2;
    --sep:rgba(84,84,88,.6); --pill:#2c2c2e; --blue:#0a84ff; --red:#ff453a;
    --glass:rgba(30,30,32,.72); --glassBorder:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="system"]{
      --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#fff; --dim:#8e8e93; --dim2:#aeaeb2;
      --sep:rgba(84,84,88,.6); --pill:#2c2c2e; --blue:#0a84ff; --red:#ff453a;
      --glass:rgba(30,30,32,.72); --glassBorder:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--text);
    font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  button{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}

  /* ---------- большой заголовок ---------- */
  .lt{padding:calc(env(safe-area-inset-top) + 18px) 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .lt small{display:block;color:var(--dim);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
  .lt h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .avatar{width:36px;height:36px;border-radius:50%;border:0;padding:0;cursor:pointer;overflow:hidden;flex:none;
    background:var(--pill);box-shadow:0 0 0 .5px var(--sep)}
  .avatar img{width:100%;height:100%;object-fit:cover}

  /* ---------- карточки «Сегодня» ---------- */
  .today{display:grid;gap:22px;margin-top:14px}
  .tc{position:relative;border-radius:var(--r-card);overflow:hidden;color:#fff;cursor:pointer;min-height:420px;
    box-shadow:0 10px 30px var(--shadow);transition:transform .2s cubic-bezier(.2,.9,.3,1)}
  .tc:active{transform:scale(.97)}
  .tc .tx{position:absolute;left:20px;right:20px;top:20px;z-index:2}
  .tc small{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;opacity:.8}
  .tc h2{margin:4px 0 0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em;max-width:85%}
  .tc .art{position:absolute;right:-20px;bottom:40px;font-size:190px;transform:rotate(-12deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
  .tc .ft{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;display:flex;align-items:center;gap:12px;
    background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:2}
  .tc .ft p{margin:0;font-size:14px;opacity:.95;flex:1}
  .tc .ft img{width:40px;height:40px;border-radius:22.37%}
  .hero-app{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:60px}
  .hero-app img{width:150px;height:150px;border-radius:22.37%;box-shadow:0 20px 40px rgba(0,0,0,.3)}

  /* ---------- секции ---------- */
  .sec{margin-top:30px;border-top:.5px solid var(--sep);padding-top:16px}
  .sec:first-of-type{border-top:0}
  .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .sh h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .sh a{color:var(--blue);font-size:17px;cursor:pointer;white-space:nowrap}
  .sh p{margin:2px 0 0;color:var(--dim);font-size:15px}

  /* горизонтальная подборка по 3 строки */
  .rail{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:calc(100% - 28px);
    gap:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -20px 0;padding:0 20px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail .ar{scroll-snap-align:start}
  .rail.one{grid-template-rows:auto}

  /* строка приложения */
  .ar{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;min-width:0}
  .ar .ic{width:64px;height:64px;border-radius:22.37%;flex:none;object-fit:cover;background:var(--pill);
    box-shadow:0 0 0 .5px var(--sep)}
  .ar .mt{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;
    border-bottom:.5px solid var(--sep);padding:6px 0;margin:-8px 0}
  .ar:last-child .mt,.rail .ar:nth-child(3n) .mt{border-bottom-color:transparent}
  .ar .nm{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ar .sb{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ar .sb.w{color:var(--red)}
  .ar .rk{width:18px;flex:none;font-weight:600;font-size:17px;text-align:center;margin-left:-4px}
  .getwrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
  .get{border:0;border-radius:999px;background:var(--pill);color:var(--blue);font-weight:700;font-size:15px;
    padding:6px 0;width:84px;text-align:center;cursor:pointer;display:inline-block}
  .get:active{opacity:.55}
  .getwrap small{font-size:9.5px;color:var(--dim);line-height:1}
  .list{margin-top:6px}

  /* ---------- поиск ---------- */
  .sf{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--pill);border-radius:12px;padding:0 10px;height:38px}
  .sf svg{width:17px;height:17px;flex:none;color:var(--dim)}
  .sf input{flex:1;border:0;background:none;outline:none;font:17px inherit;font-family:inherit;color:var(--text);min-width:0}
  .sf input::placeholder{color:var(--dim)}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .cat{border-radius:16px;height:96px;padding:12px;color:#fff;font-weight:700;font-size:17px;position:relative;overflow:hidden;cursor:pointer}
  .cat span{position:absolute;right:-6px;bottom:-12px;font-size:64px;transform:rotate(-12deg)}
  .cat:active{transform:scale(.97)}

  /* ---------- пусто ---------- */
  .empty{text-align:center;color:var(--dim);padding:40px 20px}
  .empty .e{font-size:56px;margin-bottom:10px}
  .empty b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}

  /* ---------- страницы ---------- */
  .page{display:none}.page.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .back{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;border:0;background:none;padding:0;cursor:pointer;
    margin-top:calc(env(safe-area-inset-top) + 14px)}
  .back svg{width:22px;height:22px}

  /* ---------- стеклянный таб-бар ---------- */
  .tabbar{position:fixed;left:50%;bottom:max(8px, calc(env(safe-area-inset-bottom) - 14px));transform:translateX(-50%);z-index:20;
    display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    border:.5px solid var(--glassBorder);box-shadow:0 10px 40px var(--shadow),0 1px 0 rgba(255,255,255,.4) inset;
    width:min(calc(100% - 24px),460px)}
  .tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;
    border-radius:999px;color:var(--text);font-size:10.5px;font-weight:600;cursor:pointer;position:relative;transition:background .2s,color .2s}
  .tab svg{width:25px;height:25px}
  .tab.on{color:var(--blue);background:rgba(127,127,140,.14)}
  .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;
    font-size:11px;line-height:17px;padding:0 4px;font-weight:600}

  /* ---------- шит ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 14px);max-width:820px;margin:0 auto;
    background:var(--bg);border-radius:14px 14px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding:0 20px calc(env(safe-area-inset-bottom) + 30px)}
  .sheet.on{transform:none}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .grab{position:sticky;top:0;padding:8px 0 4px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);z-index:2}
  .grab i{width:36px;height:5px;border-radius:3px;background:var(--sep);position:absolute;left:50%;top:6px;margin-left:-18px}
  .close{margin-left:auto;margin-top:6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--pill);color:var(--dim2);
    font-size:17px;font-weight:700;cursor:pointer;display:grid;place-items:center}

  /* страница приложения */
  .ah{display:flex;gap:16px;margin-top:6px}
  .ah .ic{width:118px;height:118px;border-radius:22.37%;flex:none;box-shadow:0 0 0 .5px var(--sep)}
  .ah .mt{flex:1;min-width:0;display:flex;flex-direction:column}
  .ah h2{margin:2px 0 0;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  .ah .sub{color:var(--dim);font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ah .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .get.blue{background:var(--blue);color:#fff;width:92px}
  .share{border:0;background:none;color:var(--blue);cursor:pointer;padding:4px}
  .share svg{width:24px;height:24px}
  .info{display:flex;margin:22px -20px 0;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--sep)}
  .info::-webkit-scrollbar{display:none}
  .info div{flex:none;min-width:104px;text-align:center;padding:0 12px;border-left:.5px solid var(--sep)}
  .info div:first-child{border-left:0;padding-left:0}
  .info small{display:block;color:var(--dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .info b{display:block;font-size:20px;color:var(--dim2);margin:4px 0 2px;font-weight:700}
  .info span{display:block;color:var(--dim);font-size:12px}
  .blk{padding:16px 0;border-bottom:.5px solid var(--sep)}
  .blk h3{margin:0 0 8px;font-size:22px;font-weight:700}
  .blk p{margin:0;font-size:15px;line-height:1.45;color:var(--text)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:.5px solid var(--sep);font-size:15px}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;word-break:break-all}
  .wbox{margin-top:16px;padding:14px 16px;border-radius:var(--r-group);background:rgba(255,59,48,.12);color:var(--red);font-size:15px;line-height:1.4}

  /* сгруппированные списки (настройки) */
  .gl{background:var(--bg2);border-radius:var(--r-group);overflow:hidden;margin-top:8px}
  .gh{color:var(--dim);font-size:13px;text-transform:uppercase;margin:26px 16px 0;letter-spacing:.02em}
  .gf{color:var(--dim);font-size:13px;margin:8px 16px 0;line-height:1.4}
  .gf b{color:var(--text);font-weight:600}
  .gr{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px}
  .gr .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:17px;color:#fff;flex:none}
  .gr .t{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-bottom:.5px solid var(--sep);padding:8px 0}
  .gr:last-child .t{border-bottom:0}
  .gr .t small{color:var(--dim);font-size:13px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(118,118,128,.16);border-radius:9px;padding:2px;margin:12px 16px}
  .seg button{border:0;background:none;font-size:14px;font-weight:600;padding:7px 0;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}


  /* ---------- настройки в стиле iOS ---------- */
  .avatar{display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
  .avatar.anon{background:linear-gradient(180deg,#b5b5bb,#8e8e93)}
  .avatar svg{width:22px;height:22px}
  .st{padding:6px 0 10px}
  .st h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
  .acct{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
  .av{border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:600;
    background:linear-gradient(180deg,#b5b5bb,#8e8e93)}
  .av img{width:100%;height:100%;object-fit:cover}
  .av svg{width:56%;height:56%}
  .acct .t{flex:1;min-width:0}
  .acct .t b{display:block;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .t small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
  .gr.btn{cursor:pointer}
  .gr.btn:active{background:rgba(127,127,140,.12)}
  .gr .t{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
  .gr .t .lbl{display:flex;flex-direction:column;min-width:0}
  .gr .val{color:var(--dim);font-size:17px;white-space:nowrap}
  .chev{width:8px;height:14px;flex:none;color:#c4c4c7;margin-left:6px}
  .gr.center .t{justify-content:center}
  .gr.danger .t{color:var(--red);justify-content:center;font-weight:400}
  .check{color:var(--blue);font-weight:700}
  .bk{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;border:0;background:none;padding:6px 0;cursor:pointer}
  .bk svg{width:22px;height:22px}
  .bigav{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
  .bigav b{font-size:24px;font-weight:700;margin-top:10px}
  .bigav small{color:var(--dim);font-size:15px;margin-top:2px}
  .login{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 8px 0}
  .login img.logo{width:96px;height:96px;border-radius:22.37%;box-shadow:0 10px 30px var(--shadow)}
  .login h2{margin:18px 0 6px;font-size:28px;font-weight:700}
  .login p{margin:0;color:var(--dim);font-size:15px;line-height:1.4;max-width:320px}
  .lbtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:28px;align-items:stretch}
  .abtn{height:44px;border-radius:999px;border:0;background:#000;color:#fff;font-size:17px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  :root[data-theme="dark"] .abtn{background:#fff;color:#000}
  @media (prefers-color-scheme: dark){ :root[data-theme="system"] .abtn{background:#fff;color:#000} }
  .abtn svg{width:18px;height:18px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .fine{color:var(--dim);font-size:12px;line-height:1.4;margin-top:22px;max-width:320px}
  .need{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,149,0,.14);color:#c26a00;font-size:14px;line-height:1.4;text-align:left}

  /* алерт и тост */
  .cf-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:24px}
  .cf-bg.on{display:flex}
  .cf{width:270px;border-radius:14px;overflow:hidden;text-align:center;background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
  .cf .in{padding:20px 16px 18px}
  .cf .t{font-weight:600;font-size:17px}
  .cf .d{font-size:13px;margin-top:4px;line-height:1.35}
  .cf .b{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
  .cf .b>*{padding:11px 0;font-size:17px;border:0;background:none;color:var(--blue);cursor:pointer}
  .cf .b>*+*{border-left:.5px solid var(--sep)}
  .cf .b .yes{color:var(--red);font-weight:600}
  .toast{position:fixed;left:50%;bottom:calc(max(8px, calc(env(safe-area-inset-bottom) - 14px)) + 80px);transform:translate(-50%,16px);opacity:0;z-index:60;
    background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px var(--shadow)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Сегодня -->
<div class="page on" id="p-today"><div class="wrap">
  <div class="lt"><div><small id="today"></small><h1>Сегодня</h1></div>
    <button class="avatar" data-open="settings" aria-label="Аккаунт"></button></div>
  <div class="today" id="todayCards"></div>
</div></div>

<!-- Игры -->
<div class="page" id="p-games"><div class="wrap">
  <div class="lt"><h1>Игры</h1><button class="avatar" data-open="settings" aria-label="Аккаунт"></button></div>
  <div id="gamesBody"></div>
</div></div>

<!-- Приложения -->
<div class="page" id="p-apps"><div class="wrap">
  <div class="lt"><h1>Приложения</h1><button class="avatar" data-open="settings" aria-label="Аккаунт"></button></div>
  <div id="appsBody"></div>
</div></div>

<!-- Мои -->
<div class="page" id="p-my"><div class="wrap">
  <div class="lt"><h1>Мои</h1><button class="avatar" data-open="settings" aria-label="Аккаунт"></button></div>
  <div id="myBody"></div>
</div></div>

<!-- Поиск -->
<div class="page" id="p-search"><div class="wrap">
  <div class="lt"><h1>Поиск</h1><button class="avatar" data-open="settings" aria-label="Аккаунт"></button></div>
  <label class="sf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Игры, приложения и многое другое" autocomplete="off"></label>
  <div id="searchBody"></div>
</div></div>

<!-- Подстраница раздела -->
<div class="page" id="p-cat"><div class="wrap">
  <button class="back" id="catBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backLabel">Назад</span></button>
  <div class="lt" style="padding-top:6px"><h1 id="catTitle"></h1></div>
  <div id="catBody"></div>
</div></div>

<nav class="tabbar" id="tabbar">
  <button class="tab on" data-p="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="4"/><path d="M8 8.5h8M8 12h5"/></svg>Сегодня</button>

let afterLogin = null;
function onGoogle(resp) {
  const d = decodeJWT(resp.credential); if (!d) return toast("Не получилось войти");
  userSet({provider:"Google", name:d.name || d.email, email:d.email, picture:d.picture || "", sub:d.sub});
  loggedIn();
}
async function signInApple() {
  try {
    AppleID.auth.init({clientId:AUTH.apple_client_id, scope:"name email", redirectURI:AUTH.apple_redirect_uri, usePopup:true});
    const r = await AppleID.auth.signIn();
    const d = decodeJWT(r.authorization.id_token) || {};
    const prev = userGet();
    const nm = r.user && r.user.name ? `${r.user.name.firstName || ""} ${r.user.name.lastName || ""}`.trim() : (prev && prev.sub === d.sub ? prev.name : "");
    userSet({provider:"Apple", name:nm || d.email || "Пользователь Apple", email:d.email || "", picture:"", sub:d.sub});
    loggedIn();
  } catch (e) { if (!e || e.error !== "popup_closed_by_user") toast("Вход через Apple не удался"); }
}
function loggedIn() {
  const u = userGet(); toast(`Привет, ${(u.name || "").split(" ")[0] || "друг"}!`);
  const next = afterLogin; afterLogin = null;
  if (next) { closeSheet(); setTimeout(() => install(next), 350); } else openSettings();
}
function signOut() {
  try { if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); } catch (e) {}
  userSet(null); toast("Вы вышли из аккаунта"); openSettings();
}
function openLogin(app) {
  afterLogin = app || null;
  sheet(`<div class="login"><img class="logo" src="ruapps_icon.png" alt="">
    <h2>Вход в RuApps</h2>
    <p>${app ? `Чтобы загрузить «${esc(app.name)}», войдите в аккаунт.` : "Войдите, чтобы загружать приложения."}</p>
    <div class="lbtns">
      ${hasApple() ? `<button class="abtn" id="abtn">${APPLE}Войти через Apple</button>` : ""}
      ${hasGoogle() ? `<div id="gbtn"></div>` : ""}
      ${authOn() ? "" : `<div class="need">Вход пока не подключён владельцем магазина. Пока он не настроен, приложения загружаются без входа.</div>`}
    </div>
    <div class="fine">Пароль вы вводите на странице Google или Apple — RuApps его не видит. Мы получаем только имя, e-mail и фото профиля, и храним их только на этом устройстве.</div></div>`);
  if (hasApple()) $("#abtn").addEventListener("click", signInApple);
  if (hasGoogle()) mountGoogle();
}
function mountGoogle(tries = 0) {
  const el = $("#gbtn"); if (!el) return;
  if (!(window.google && google.accounts && google.accounts.id)) { if (tries < 40) setTimeout(() => mountGoogle(tries + 1), 150); else el.textContent = "Google не загрузился. Проверь интернет."; return; }
  google.accounts.id.initialize({client_id:AUTH.google_client_id, callback:onGoogle, ux_mode:"popup", auto_select:false});
  const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light" || document.documentElement.dataset.theme === "dark";
  google.accounts.id.renderButton(el, {theme:dark ? "filled_black" : "outline", size:"large", shape:"pill", text:"signin_with", locale:"ru", width:320});
}

/* ---------- настройки ---------- */
const THEMES = {system:"Авто", light:"Светлая", dark:"Тёмная"};
function grow({icon, bg, label, sub, val, chev = true, act, cls = ""}) {
  return `<div class="gr ${act ? "btn" : ""} ${cls}" ${act ? `data-act="${act}"` : ""}>
    ${icon ? `<div class="ico" style="background:${bg || "none"}">${icon}</div>` : ""}
    <div class="t"><div class="lbl">${label}${sub ? `<small>${sub}</small>` : ""}</div>
      <div style="display:flex;align-items:center">${val ? `<span class="val">${val}</span>` : ""}${chev ? CHEV : ""}</div></div></div>`;
}
function openSettings() {
  const u = userGet(), t = document.documentElement.dataset.theme || "system";
  const myN = myGet().length;
  sheet(`<div class="st"><h1>Настройки</h1></div>
    <div class="gl"><div class="acct" data-act="${u ? "account" : "login"}">${avHTML(u, 60)}
      <div class="t">${u ? `<b>${esc(u.name)}</b><small>Аккаунт RuApps, вход через ${esc(u.provider)}</small>`
                         : `<b style="color:var(--blue)">Войти</b><small>Войдите, чтобы загружать приложения</small>`}</div>${CHEV}</div></div>

    <div class="gl" style="margin-top:28px">
      ${grow({icon:"🌓", bg:"#5856d6", label:"Оформление", val:THEMES[t], act:"theme"})}
      ${grow({icon:"🛍️", bg:"#007aff", label:"Мои приложения", val:myN || "", act:"my"})}
    </div>

    <div class="gl" style="margin-top:28px">
      ${grow({icon:'<img src="ruapps_icon.png" style="width:30px;height:30px;border-radius:7px">', label:"RuApps на экран «Домой»", act:"home"})}
      ${grow({icon:"🛡️", bg:"#34c759", label:"DNS", val:DNS.length + " " + plural(DNS.length, "профиль", "профиля", "профилей"), act:"dns"})}
    </div>

    <div class="gl" style="margin-top:28px">
      ${grow({icon:"ℹ️", bg:"#8e8e93", label:"О RuApps", act:"about"})}
    </div>
    ${u ? `<div class="gl" style="margin-top:28px">${grow({label:"Выйти", chev:false, act:"logout", cls:"danger"})}</div>` : ""}
    <div class="gf" style="text-align:center;margin-top:24px">RuApps · ${APPS.length} ${plural(APPS.length, "приложение", "приложения", "приложений")}</div>`);
}
function sub(title, html) {
  sheet(`<button class="bk" data-act="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Настройки</button>
    <div class="st"><h1 style="font-size:30px">${title}</h1></div>${html}`);
}
function openAccount() {
  const u = userGet(); if (!u) return openLogin();
  sub("Аккаунт", `<div class="bigav">${avHTML(u, 96)}<b>${esc(u.name)}</b><small>${esc(u.email || "")}</small></div>
    <div class="gl" style="margin-top:22px">
      ${grow({label:"Имя", val:esc(u.name), chev:false})}
      ${grow({label:"E-mail", val:esc(u.email || "скрыт"), chev:false})}
      ${grow({label:"Вход через", val:esc(u.provider), chev:false})}
    </div>
    <div class="gl" style="margin-top:28px">${grow({icon:"🛍️", bg:"#007aff", label:"Мои приложения", val:myGet().length || "", act:"my"})}</div>
    <div class="gl" style="margin-top:28px">${grow({label:"Выйти", chev:false, act:"logout", cls:"danger"})}</div>
    <div class="gf">Данные аккаунта хранятся только на этом устройстве. После выхода они удаляются.</div>`);
}
function openTheme() {
  const t = document.documentElement.dataset.theme || "system";
  sub("Оформление", `<div class="gl" style="margin-top:8px">${Object.entries(THEMES).map(([k, v]) =>
      `<div class="gr btn" data-theme-set="${k}"><div class="t"><div class="lbl">${v}</div>${t === k ? '<span class="check">✓</span>' : ""}</div></div>`).join("")}</div>
    <div class="gf">«Авто» — как в настройках iPhone.</div>`);
}
function openHome() {
  sub("Экран «Домой»", `<div class="gl" style="margin-top:8px"><div class="gr"><div class="ico"><img src="ruapps_icon.png" style="width:30px;height:30px;border-radius:7px"></div>
      <div class="t"><div class="lbl">Установить как приложение<small>Открывается на весь экран</small></div><a class="get" href="profiles/ruapps-app.mobileconfig">Профиль</a></div></div></div>
    <div class="gf"><b>Как установить:</b> «Профиль» → «Разрешить» → Настройки → «Профиль загружен» → «Установить».</div>`);
}
function openDNS() {
  sub("DNS", `<div class="gl" style="margin-top:8px">${DNS.map(d => `<div class="gr"><div class="ico" style="background:${esc(d.color)}">${esc(d.emoji)}</div>
      <div class="t"><div class="lbl">${esc(d.name)}<small>${esc(d.desc)}</small></div><a class="get" href="${esc(d.file)}">Профиль</a></div></div>`).join("")}</div>
    <div class="gf">Каждый DNS-профиль заодно ставит RuApps на экран «Домой».<br><br>
      <b>Включить:</b> Настройки → Основные → VPN и управление устройством → DNS.<br>
      <b>Удалить:</b> там же → профиль → «Удалить профиль».</div>`);
}
function openAbout() {
  sub("О RuApps", `<div class="bigav"><img src="ruapps_icon.png" style="width:96px;height:96px;border-radius:22.37%"><b>RuApps</b><small>Магазин приложений в браузере</small></div>
    <div class="gl" style="margin-top:22px">
      ${grow({label:"Приложений", val:APPS.length, chev:false})}
      ${grow({label:"Разделов", val:CATS.length, chev:false})}
    </div>`);
}
document.addEventListener("click", e => {
  const ts = e.target.closest("[data-theme-set]");
  if (ts) { setTheme(ts.dataset.themeSet); openTheme(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  ({ login:() => openLogin(), account:openAccount, theme:openTheme, home:openHome, dns:openDNS, about:openAbout,
     back:openSettings, logout:signOut, my:() => { closeSheet(); showPage("my"); } }[a.dataset.act] || (() => {}))();
});

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ruapps-theme", t); } catch (e) {}
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#ffffff";
}
setTheme(document.documentElement.dataset.theme || "system");

/* ---------- шит ---------- */
function sheet(html) {
  $("#sheet").innerHTML = `<div class="grab"><i></i><button class="close" id="sclose" aria-label="Закрыть">✕</button></div>${html}`;
  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("on"); $("#sbg").classList.add("on");
  $("#sclose").addEventListener("click", closeSheet);
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#sbg").classList.remove("on"); }
$("#sbg").addEventListener("click", closeSheet);

/* ---------- установка ---------- */
function install(a) {
  if (authOn() && !userGet()) { openLogin(a); return; }
  if (a.warn) { $("#cfYes").href = a.install; $("#cfYes").dataset.i = APPS.indexOf(a); $("#cf").classList.add("on"); return; }
  addMine(a); location.href = a.install;
}
$("#cfNo").addEventListener("click", () => $("#cf").classList.remove("on"));
$("#cfYes").addEventListener("click", () => { addMine(APPS[+$("#cfYes").dataset.i]); setTimeout(() => $("#cf").classList.remove("on"), 300); });
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

/* ---------- навигация ---------- */
let curPage = "today";
function showPage(p) {
  curPage = p;
  $$(".page").forEach(x => x.classList.toggle("on", x.id === "p-" + p));
  if (p !== "cat") $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === p));
  window.scrollTo(0, 0);
}
$$(".tab").forEach(t => t.addEventListener("click", () => {
  if (t.dataset.p === curPage) { window.scrollTo({top:0, behavior:"smooth"}); return; }
  showPage(t.dataset.p); if (t.dataset.p === "search") setTimeout(() => $("#q").focus(), 50);
}));

document.addEventListener("click", e => {
  const ins = e.target.closest("[data-install]");
  if (ins) { e.stopPropagation(); install(APPS[+ins.dataset.install]); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm) { mySet(myGet().filter(b => b !== APPS[+rm.dataset.remove].bundle)); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const a = APPS[+sh.dataset.share], url = location.href.split("#")[0];
    if (navigator.share) navigator.share({title:a.name, text:`${a.name} в RuApps`, url}).catch(() => {});
    else { navigator.clipboard && navigator.clipboard.writeText(url); toast("Ссылка скопирована"); } return; }
  if (e.target.closest("[data-open='settings']")) { openSettings(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat && !e.target.closest(".ar")) { openCat(cat.dataset.cat); return; }
  const row = e.target.closest("[data-i]");
  if (row) openApp(APPS[+row.dataset.i]);
});

renderAvatars(); renderToday(); renderGames(); renderApps(); renderSearch(); renderMy();
</script>
</body>
</html>
